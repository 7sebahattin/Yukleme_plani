<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Giriş Tanımlı">
  <defs>
    <linearGradient id="gtCerceve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset=".45" stop-color="#9aa6b8"/>
      <stop offset="1" stop-color="#5d6a7e"/>
    </linearGradient>
    <linearGradient id="gtIc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#1747b8"/>
    </linearGradient>
    <linearGradient id="gtKapi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4fc4"/>
      <stop offset=".6" stop-color="#3a7bf0"/>
      <stop offset="1" stop-color="#2459d6"/>
    </linearGradient>
    <linearGradient id="gtKisi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa6ff"/>
      <stop offset="1" stop-color="#1f5fd8"/>
    </linearGradient>
    <radialGradient id="gtBas" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#f3dcc6"/>
      <stop offset="1" stop-color="#b58e6c"/>
    </radialGradient>
    <radialGradient id="gtGolge" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0b1a33" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0b1a33" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- zemin gölgesi -->
  <ellipse cx="60" cy="108" rx="44" ry="7" fill="url(#gtGolge)"/>
  <!-- kapı çerçevesi (metal kenar + mavi iç) -->
  <path d="M18 106V30a20 20 0 0 1 20-20h28a20 20 0 0 1 20 20v76h-12V32a10 10 0 0 0-10-10H40a10 10 0 0 0-10 10v74z" fill="url(#gtCerceve)"/>
  <path d="M22 106V31a16 16 0 0 1 16-16h28a16 16 0 0 1 16 16v75h-5V32a12 12 0 0 0-12-12H39a12 12 0 0 0-12 12v74z" fill="url(#gtIc)"/>
