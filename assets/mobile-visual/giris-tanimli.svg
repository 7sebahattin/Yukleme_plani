  <g>
    <circle cx="52" cy="38" r="8" fill="url(#gtBas)"/>
    <path d="M44 50c2-3 6-4.5 10-3.5 3 .7 5 2.8 6 5.6l4 12 7 4.5c1.6 1 2 3 1 4.6s-3 2-4.6 1l-8.4-5.4-2-5.5-3 11 8 9 3 14c.4 2-1 3.8-3 4.2s-3.8-.9-4.2-2.8l-2.6-12.2-7-7.5-4 11-9 9c-1.4 1.4-3.6 1.4-5 0s-1.4-3.6 0-5l8.2-8.2 6.8-21-4.6 4.4-6 2.4c-1.8.7-3.8-.2-4.5-2s.2-3.8 2-4.5l5-2z" fill="url(#gtKisi)" stroke="#164bb8" stroke-width="1" stroke-linejoin="round"/>
