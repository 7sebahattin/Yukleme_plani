  <path d="M30 106V33a10 10 0 0 1 10-10h24a10 10 0 0 1 10 10v73z" fill="#f4f8ff"/>
  <!-- anahtar (sol kanat) -->
  <g fill="#f4f8ff">
    <circle cx="24.5" cy="62" r="3.2"/>
    <rect x="23.6" y="64" width="1.8" height="9" rx=".9"/>
    <rect x="25" y="68" width="2.6" height="1.6" rx=".6"/>
    <rect x="25" y="71" width="2" height="1.4" rx=".6"/>
  </g>
  <circle cx="24.5" cy="62" r="1.3" fill="#1d4fc4"/>
  <!-- açık kapı kanadı (perspektif) -->
  <path d="M74 106V26l26-8v84z" fill="url(#gtKapi)" stroke="#123a96" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M79 98V31l16-4.5v67z" fill="none" stroke="#5c95ff" stroke-width="1.6" stroke-linejoin="round" opacity=".8"/>
  <circle cx="81.5" cy="64" r="2.2" fill="#dfe8ff"/>
